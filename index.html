<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content" />
    <title>Groq Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              primary: '#2563eb', // Blue 600
              surface: '#f3f4f6', // Gray 100
            }
          }
        }
      }
    </script>
    <style>
      html, body {
        height: 100%;
        overflow: hidden; /* Prevent body scroll, handle inside App */
        background-color: #ffffff;
        -webkit-tap-highlight-color: transparent;
      }
      
      /* Markdown Cleanup */
      .markdown-body { font-size: 15px; line-height: 1.6; }
      .markdown-body p { margin-bottom: 0.75em; }
      .markdown-body pre { 
        background: #18181b; 
        padding: 12px; 
        border-radius: 8px; 
        overflow-x: auto; 
        margin: 8px 0;
        border: 1px solid #27272a;
      }
      .markdown-body code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.9em;
      }
      .markdown-body ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 0.75em; }
      .markdown-body ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 0.75em; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",

    "recharts": "https://esm.sh/recharts@^3.6.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1?bundle",
    "remark-gfm": "https://esm.sh/remark-gfm@4.0.0?bundle"
  }
}
</script>
</head>
